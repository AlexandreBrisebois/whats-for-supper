  /api/schedule/{weekOffset}/grocery/item:
    patch:
      summary: Toggle a single grocery item (checked/unchecked)
      description: >-
        On one application instance, stores the supplied intended check value while retaining
        other current persisted entries. Item updates, full-map replacements and recomputation
        transitions share one server processing order, which does not imply click or arrival
        order. Returns 204 after persistence and the grocery publication attempt. Publication
        attempts follow this processing order; independent snapshots may still arrive late.
        A fresh read after outstanding operations settle recovers committed state.
      parameters:
        - name: weekOffset
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredientName, checked]
              properties:
                ingredientName:
                  type: string
                  example: 'Chicken Breast'
                checked:
                  type: boolean
                  example: true
      responses:
        '503':
          description: Online recovery coordination is busy; retry after Retry-After seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryBusyError' }
        '204':
          description: No Content

  /api/schedule/{weekOffset}/grocery:
    patch:
      summary: Update grocery checklist state for a week
      description: >-
        Replaces the entire recipe-derived check map with the supplied dictionary, including
        explicit false values; an empty dictionary clears it. On one application instance this
        replacement shares server processing order with item updates and recomputation.
        Missing keys in a stale replacement body are not merged from persisted state.
        Returns 200 after persistence and the ordered grocery publication attempt. Notification
        failure does not roll back a committed map; a fresh read recovers committed state.
      parameters:
        - name: weekOffset
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              example:
                'Chicken Breast': true
                'Olive Oil': false
      responses:
        '503':
          description: Online recovery coordination is busy; retry after Retry-After seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryBusyError' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean

