  /api/captures/failures/{id}/retry:
    post:
      summary: Retry a failed capture
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '403':
          $ref: '#/components/responses/DemoAiUnavailable'
        '503':
          description: Online recovery coordination is busy; retry after Retry-After seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryBusyError' }
        '202':
          description: Retry queued on the existing workflow and recipe. Saved URL initialization retries reconcile existing work and do not create another capture; acceptance does not certify recipe readiness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CaptureFailureRetryResponse' }
        '409':
          description: Retry already in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  message: { type: string }

