  /api/captures/failures:
    get:
      summary: List active failed capture records
      responses:
        '200':
          description: List of failed captures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CaptureFailureListResponse' }

  /api/captures/failures/{id}/retry:
    post:
      summary: Retry a failed capture
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CaptureFailureRetryResponse' }
        '409':
          description: Retry already in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  message: { type: string }

  /api/captures/failures/{id}:
    delete:
      summary: Clear a failed capture and queue Dreaming cleanup
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Failed capture cleared and cleanup queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CaptureFailureClearResponse' }
        '404':
          description: Failed capture not found
        '409':
          description: Capture workflow is not in a clearable failed state
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  message: { type: string }
        '422':
          description: Unsupported payload version
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode: { type: string }
                  message: { type: string }
