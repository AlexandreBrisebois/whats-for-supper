  /api/inventory-captures:
    post:
      summary: Submit pantry photos and get an inventory snapshot
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryCaptureRequest'
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InventoryCaptureResponse' }
        '202':
          description: Vision model busy — retry later
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InventoryCaptureBusyResponse' }

  /api/inventory-captures/{id}:
    get:
      summary: Retrieve a pantry snapshot by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Snapshot found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InventoryCaptureResponse' }
        '404':
          description: Snapshot not found or expired
