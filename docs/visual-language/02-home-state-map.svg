<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2466" viewBox="0 0 800 2466" role="img" aria-labelledby="title desc">
<title id="title">Home: state, icon, intent and consequence</title><desc id="desc">Five schematic Home states with explicit source versus proposal boundaries. Existing ochre Cook, sage non-cooking intent and full sage cooked celebration are preserved as roles; proposed foregrounds improve contrast. Existing action icons and Capture/Browse routes reinforce meaning. The separate suggested Home card remains conceptual only. No runtime changes.</desc>
