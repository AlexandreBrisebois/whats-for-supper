<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2040" viewBox="0 0 800 2040" role="img" aria-labelledby="title desc">
<title id="title">Home: state, intent and consequence</title><desc id="desc">Five schematic Home reference states: unplanned, conceptual suggestion, saved planned meal, non-cooking intent and cooked. Layout and visual treatment are proposed, behavior is source-verified except the explicitly conceptual suggestion. Includes current labels and action consequences, not a functioning prototype.</desc>
<style>text { font-family: Inter, "DejaVu Sans", sans-serif; } .heading { font-family: Outfit, Inter, "DejaVu Sans", sans-serif; }</style>
<rect x="0" y="0" width="800" height="2040" rx="0" fill="#FDFCF0"/>
<text x="32" y="40" font-size="14" fill="#4B5563" font-weight="700">WFS / VISUAL LANGUAGE / V1</text>
<text x="32" y="84" font-size="30" fill="#1F2937" font-weight="700" class="heading">What is true about tonight?</text>
<text x="32" y="116" font-size="16" fill="#4B5563" font-weight="400">02  Home state map · not five interchangeable cards</text>
<text x="32" y="140" font-size="16" fill="#4B5563" font-weight="400">Proposed visual hierarchy; current behavior is named beside each sketch.</text>
<text x="32" y="194" font-size="21" fill="#1F2937" font-weight="700">1  Unplanned</text>
<text x="440" y="194" font-size="14" fill="#4B5563" font-weight="700">CURRENT BEHAVIOR</text>
<rect x="32" y="214" width="370" height="244" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<text x="52" y="249" font-size="19" fill="#1F2937" font-weight="700">Nothing planned yet</text>
<text x="52" y="279" font-size="15" fill="#4B5563" font-weight="400">No recipe assigned to tonight.</text>
<rect x="52" y="302" width="330" height="48" rx="14" fill="#FDFCF0" stroke="#4B5563" stroke-width="2"/>
<text x="68" y="332" font-size="16" fill="#1F2937" font-weight="700">Quick Find</text>
<rect x="52" y="360" width="330" height="48" rx="14" fill="#FDFCF0" stroke="#4B5563" stroke-width="2"/>
<text x="68" y="390" font-size="16" fill="#1F2937" font-weight="700">Order In</text>
<text x="432" y="244" font-size="15" fill="#4B5563" font-weight="400">Quick Find opens recipe selection.</text>
<text x="432" y="273" font-size="15" fill="#4B5563" font-weight="400">It is not a duration filter.</text>
<text x="432" y="302" font-size="15" fill="#4B5563" font-weight="400">Order In records non-cooking intent;</text>
<text x="432" y="331" font-size="15" fill="#4B5563" font-weight="400">it does not leave the day blank.</text>
<text x="432" y="360" font-size="15" fill="#4B5563" font-weight="400">A ready GOTO adds Make This Tonight.</text>
<text x="432" y="389" font-size="15" fill="#4B5563" font-weight="400">Capture and Browse remain available.</text>
<text x="32" y="514" font-size="21" fill="#1F2937" font-weight="700">2  Suggested</text>
<text x="440" y="514" font-size="14" fill="#7B3829" font-weight="700">CONCEPTUAL PROPOSAL</text>
<rect x="32" y="534" width="370" height="244" rx="24" fill="#FFFFFF" stroke="#A44A37" stroke-width="2" stroke-dasharray="6 4"/>
<text x="52" y="569" font-size="19" fill="#1F2937" font-weight="700">Suggestion · not saved</text>
<text x="52" y="599" font-size="15" fill="#4B5563" font-weight="400">Example household recipe</text>
<rect x="52" y="622" width="330" height="48" rx="14" fill="#A44A37"/>
<text x="68" y="652" font-size="16" fill="#FFFFFF" font-weight="700">Choose for tonight</text>
<text x="52" y="715" font-size="14" fill="#4B5563" font-weight="400">State stays visible above the action.</text>
<text x="432" y="564" font-size="15" fill="#4B5563" font-weight="400">A dedicated suggestion state is NOT</text>
<text x="432" y="593" font-size="15" fill="#4B5563" font-weight="400">verified as a current Home view.</text>
<text x="432" y="622" font-size="15" fill="#4B5563" font-weight="400">Candidate ≠ assigned meal.</text>
<text x="432" y="651" font-size="15" fill="#4B5563" font-weight="400">Selection would need explicit save</text>
<text x="432" y="680" font-size="15" fill="#4B5563" font-weight="400">feedback before calling it planned.</text>
<text x="432" y="709" font-size="15" fill="#4B5563" font-weight="400">Copy and behavior require approval.</text>
<text x="32" y="834" font-size="21" fill="#1F2937" font-weight="700">3  Saved / planned</text>
<text x="440" y="834" font-size="14" fill="#4B5563" font-weight="700">CURRENT BEHAVIOR</text>
<rect x="32" y="854" width="370" height="244" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<text x="52" y="889" font-size="19" fill="#1F2937" font-weight="700">Tonight’s Menu</text>
<text x="52" y="919" font-size="15" fill="#4B5563" font-weight="400">Example recipe · assigned tonight</text>
<rect x="52" y="942" width="330" height="48" rx="14" fill="#A44A37"/>
<text x="68" y="972" font-size="16" fill="#FFFFFF" font-weight="700">Cook</text>
<rect x="52" y="1000" width="330" height="48" rx="14" fill="#FDFCF0" stroke="#4B5563" stroke-width="2"/>
<text x="68" y="1030" font-size="16" fill="#1F2937" font-weight="700">Change Plan</text>
<text x="432" y="884" font-size="15" fill="#4B5563" font-weight="400">Cook opens Cook’s Mode.</text>
<text x="432" y="913" font-size="15" fill="#4B5563" font-weight="400">It does not itself mark the meal cooked.</text>
<text x="432" y="942" font-size="15" fill="#4B5563" font-weight="400">Change Plan opens recovery.</text>
<text x="432" y="971" font-size="15" fill="#4B5563" font-weight="400">Choose a backup, then resolve the</text>
<text x="432" y="1000" font-size="15" fill="#4B5563" font-weight="400">original meal before replacement.</text>
<text x="432" y="1029" font-size="15" fill="#4B5563" font-weight="400">Saving or unknown ≠ confirmed saved.</text>
<text x="32" y="1154" font-size="21" fill="#1F2937" font-weight="700">4  Non-cooking</text>
<text x="440" y="1154" font-size="14" fill="#4B5563" font-weight="700">CURRENT BEHAVIOR</text>
<rect x="32" y="1174" width="370" height="244" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<text x="52" y="1209" font-size="19" fill="#1F2937" font-weight="700">Tonight · Order In</text>
<text x="52" y="1239" font-size="15" fill="#4B5563" font-weight="400">An intentional supper plan</text>
<rect x="52" y="1262" width="330" height="48" rx="14" fill="#FDFCF0" stroke="#4B5563" stroke-width="2"/>
<text x="68" y="1292" font-size="16" fill="#1F2937" font-weight="700">Edit supper plan</text>
<text x="52" y="1355" font-size="14" fill="#4B5563" font-weight="400">State stays visible above the action.</text>
<text x="432" y="1204" font-size="15" fill="#4B5563" font-weight="400">Home opens Planner to edit the day.</text>
<text x="432" y="1233" font-size="15" fill="#4B5563" font-weight="400">Order In is a plan, not an empty slot.</text>
<text x="432" y="1262" font-size="15" fill="#4B5563" font-weight="400">Planner’s Leave this day unplanned</text>
<text x="432" y="1291" font-size="15" fill="#4B5563" font-weight="400">is the distinct blank-day action.</text>
<text x="432" y="1320" font-size="15" fill="#4B5563" font-weight="400">Mystery night is a special branch:</text>
<text x="432" y="1349" font-size="15" fill="#4B5563" font-weight="400">Home still offers supper choices.</text>
<text x="32" y="1474" font-size="21" fill="#1F2937" font-weight="700">5  Cooked</text>
<text x="440" y="1474" font-size="14" fill="#4B5563" font-weight="700">CURRENT BEHAVIOR</text>
<rect x="32" y="1494" width="370" height="244" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<text x="52" y="1529" font-size="19" fill="#1F2937" font-weight="700">Enjoy your meal!</text>
<text x="52" y="1559" font-size="15" fill="#4B5563" font-weight="400">Recipe marked as cooked</text>
<rect x="52" y="1582" width="330" height="48" rx="14" fill="#FDFCF0" stroke="#4B5563" stroke-width="2"/>
<text x="68" y="1612" font-size="16" fill="#1F2937" font-weight="700">Dismiss</text>
<text x="52" y="1675" font-size="14" fill="#4B5563" font-weight="400">State stays visible above the action.</text>
<text x="432" y="1524" font-size="15" fill="#4B5563" font-weight="400">Confirmed cooked state earns relief.</text>
<text x="432" y="1553" font-size="15" fill="#4B5563" font-weight="400">Dismiss makes the success card</text>
<text x="432" y="1582" font-size="15" fill="#4B5563" font-weight="400">compact; it does not undo cooking.</text>
<text x="432" y="1611" font-size="15" fill="#4B5563" font-weight="400">The compact Cooked tonight! badge</text>
<text x="432" y="1640" font-size="15" fill="#4B5563" font-weight="400">opens Cook’s Mode.</text>
<text x="432" y="1669" font-size="15" fill="#4B5563" font-weight="400">No new task is required to finish.</text>
<rect x="32" y="1780" width="736" height="206" rx="16" fill="#F1F3EB"/>
<text x="52" y="1814" font-size="20" fill="#525B37" font-weight="700">The decision trail must stay legible</text>
<text x="52" y="1847" font-size="15" fill="#525B37" font-weight="400">Unplanned → choose → saving → confirmed planned → Cook’s Mode → cooked</text>
<text x="52" y="1874" font-size="15" fill="#525B37" font-weight="400">Planned → Change Plan → backup → original disposition → replacement save</text>
<text x="52" y="1901" font-size="15" fill="#525B37" font-weight="400">Order In → non-cooking intent     |     Leave unplanned → blank day (Planner)</text>
<text x="52" y="1928" font-size="15" fill="#525B37" font-weight="400">Failure or unknown outcome: preserve the choice, name the stage, offer the</text>
<text x="52" y="1955" font-size="15" fill="#525B37" font-weight="400">appropriate retry/check. Do not imply completed work was rolled back.</text>
<text x="32" y="2017" font-size="13" fill="#4B5563" font-weight="400">Sketches simplify layout, omit imagery/navigation and are not screenshots. See guide for source detail.</text>
</svg>
