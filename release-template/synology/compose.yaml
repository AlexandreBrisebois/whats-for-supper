# Application services shared by both tunnel scenarios.
# Select an overlay through COMPOSE_FILE in .env (see .env.example).
services:
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
    volumes:
      - ./traefik.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - edge

  pwa:
    image: brisebois/whats-for-supper-pwa:${WFS_VERSION}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      WFS_VERSION: ${WFS_VERSION}
      API_INTERNAL_URL: http://api:9001
      DEMO_MODE: ${DEMO_MODE:-false}
      HEARTH_SECRET: ${HEARTH_SECRET:?HEARTH_SECRET must be set}
    depends_on:
      api:
        condition: service_healthy
        required: true
    networks:
      - edge
      - internal

  api:
    image: brisebois/whats-for-supper-api:${WFS_VERSION}
    restart: unless-stopped
    environment:
      Calendar__TimeZone: ${Calendar__TimeZone:-America/Toronto}
      HISTORICAL_INTEREST_WEEKS: ${HISTORICAL_INTEREST_WEEKS:-4}
      HISTORICAL_INTEREST_ENABLED: ${HISTORICAL_INTEREST_ENABLED:-true}
      COOKED_COOLDOWN_WEEKS: ${COOKED_COOLDOWN_WEEKS:-4}
      DREAMING_ROTATION_ENABLED: ${DREAMING_ROTATION_ENABLED:-true}
      ASPNETCORE_ENVIRONMENT: Production
      WFS_VERSION: ${WFS_VERSION}
      ASPNETCORE_URLS: http://+:9001
      POSTGRES_CONNECTION_STRING: postgres://recipe_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/recipe_app_db
      DATA_ROOT: /data
      HEARTH_SECRET: ${HEARTH_SECRET:?HEARTH_SECRET must be set}
      ELEVATED_ACTIONS_PIN: ${ELEVATED_ACTIONS_PIN:?ELEVATED_ACTIONS_PIN must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-3.8-flash}
      GEMINI_MODEL_ID_HERO: ${GEMINI_MODEL_ID_HERO:-models/gemini-3-pro-image}
      GEMINI_ENDPOINT: ${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-16384}
      IMPORT_TARGET_LANGUAGE: ${IMPORT_TARGET_LANGUAGE:-NONE}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-}
      WFS_ENABLE_SEMANTIC_RETRIEVAL: ${WFS_ENABLE_SEMANTIC_RETRIEVAL:-true}
      WFS_SEMANTIC_CANDIDATE_LIMIT: ${WFS_SEMANTIC_CANDIDATE_LIMIT:-50}
      WFS_SEARCH_CONFIGURATION_VERSION: ${WFS_SEARCH_CONFIGURATION_VERSION:-hybrid-search-v1}
      DREAMING_CRON_UTC: "${DREAMING_CRON_UTC:-0 6 * * *}"
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESTORE_CRON_UTC: "${DEMO_RESTORE_CRON_UTC:-0 3 * * *}"
      Recovery__BackupRoot: ${Recovery__BackupRoot:-}
      Recovery__WaitSeconds: ${Recovery__WaitSeconds:-5}
      Recovery__MaxFreezeSeconds: ${Recovery__MaxFreezeSeconds:-30}
    volumes:
      - ./data/app:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      migration:
        condition: service_completed_successfully
        required: true
    healthcheck:
      test: ["CMD", "dotnet", "/app/RecipeApi.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - internal

  migration:
    image: brisebois/whats-for-supper-db-migration:${WFS_VERSION}
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: postgres
      POSTGRES_USER: recipe_app
      POSTGRES_DB: recipe_app_db
    command:
      - -h
      - postgres
      - -U
      - recipe_app
      - recipe_app_db
      - -f
      - /schema.sql
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    networks:
      - internal

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: recipe_app_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

networks:
  edge:
  internal:
