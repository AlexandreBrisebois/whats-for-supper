http:
  middlewares:
    sse-headers:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: "no"
          Cache-Control: "no-cache"
          Content-Type: text/event-stream
          Connection: keep-alive
  routers:
    api-stream:
      rule: Path(`/api/stream`)
      entryPoints:
        - web
      service: api
      middlewares:
        - sse-headers
      priority: 100
    api:
      rule: PathPrefix(`/api`)
      entryPoints:
        - web
      service: api
    pwa:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      service: pwa
      priority: 1
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:9001
    pwa:
      loadBalancer:
        servers:
          - url: http://pwa:3000
