name: classify-recipe
parameters:
    - recipeId
tasks:
    - name: classify_dietary_profile
      processor: ClassifyDietaryProfile
      payload:
          recipeId: "{{ recipeId }}"
          forceReclassify: true

    - name: recipe_ready
      processor: RecipeReady
      depends_on:
          - classify_dietary_profile
      payload:
          recipeId: "{{ recipeId }}"
