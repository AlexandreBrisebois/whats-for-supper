name: dreaming
parameters: []
tasks:
  - name: prune
    processor: PruneWorkflows
    payload:
      retentionDays: 7

  - name: backup
    processor: StartWorkflow
    payload:
      workflowId: db-backup

  - name: maintenance
    processor: ProcessMaintenanceCommands
    payload: {}

  - name: prune-maintenance-commands
    processor: PruneMaintenanceCommands
    depends_on:
      - maintenance
    payload:
      retentionDays: 30
      batchSize: 500

  - name: finalize-overdue-meals
    processor: FinalizeOverdueMeals
    payload: {}

  - name: reconcile-search
    processor: StartWorkflow
    payload:
      workflowId: search-reconciliation

  - name: reconcile-recipe-rotation
    processor: ReconcileRecipeRotation
    depends_on:
      - finalize-overdue-meals
    payload: {}

  - name: materialize-recipe-search-filters
    processor: MaterializeRecipeSearchFilters
    depends_on:
      - finalize-overdue-meals
    payload: {}

  - name: report
    processor: GenerateDreamingReport
    depends_on:
      - prune
      - backup
      - maintenance
      - prune-maintenance-commands
      - finalize-overdue-meals
      - reconcile-search
      - reconcile-recipe-rotation
      - materialize-recipe-search-filters
    payload: {}

  - name: reschedule
    processor: StartWorkflow
    depends_on:
      - report
    payload:
      workflowId: dreaming
      schedule:
        cron: "${DREAMING_CRON_UTC:-0 6 * * *}"
