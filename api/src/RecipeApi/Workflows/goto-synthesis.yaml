name: goto-synthesis
parameters:
    - recipeId
    - description
tasks:
    - name: synthesize_recipe
      processor: SynthesizeRecipe
      payload:
          recipeId: "{{ recipeId }}"
          description: "{{ description }}"
    - name: generate_hero
      processor: GenerateHero
      depends_on:
          - synthesize_recipe
      payload:
          recipeId: "{{ recipeId }}"
    - name: sync_recipe
      processor: SyncRecipe
      depends_on:
          - generate_hero
      payload:
          recipeId: "{{ recipeId }}"
    - name: categorize_ingredients
      processor: CategorizeIngredients
      depends_on:
          - sync_recipe
      payload:
          recipeId: "{{ recipeId }}"
    - name: categorize_recipe
      processor: CategorizeRecipe
      depends_on:
          - categorize_ingredients
      payload:
          recipeId: "{{ recipeId }}"
    - name: recipe_ready
      processor: RecipeReady
      depends_on:
          - categorize_recipe
      payload:
          recipeId: "{{ recipeId }}"
