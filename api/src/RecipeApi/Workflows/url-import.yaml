name: url-import
parameters:
    - recipeId
    - url

tasks:
    - name: fetch_url_content
      processor: FetchUrlContent
      payload:
          recipeId: "{{ recipeId }}"
          url: "{{ url }}"

    - name: extract_recipe
      processor: ExtractRecipe
      depends_on:
          - fetch_url_content
      payload:
          recipeId: "{{ recipeId }}"

    - name: generate_hero
      processor: GenerateHero
      depends_on:
          - extract_recipe
      payload:
          recipeId: "{{ recipeId }}"

    - name: sync_recipe
      processor: SyncRecipe
      depends_on:
          - generate_hero
      payload:
          recipeId: "{{ recipeId }}"

    - name: recipe_ready
      processor: RecipeReady
      depends_on:
          - sync_recipe
      payload:
          recipeId: "{{ recipeId }}"
