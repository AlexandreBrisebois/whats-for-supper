name: url-import
parameters:
    - recipeId
    - url

tasks:
    - name: fetch_url_content
      processor: FetchUrlContent
      payload:
          recipeId: "{{ recipeId }}"
          url: "{{ url }}"

    - name: extract_recipe
      processor: ExtractRecipe
      depends_on:
          - fetch_url_content
      payload:
          recipeId: "{{ recipeId }}"

    - name: generate_hero
      processor: GenerateHero
      depends_on:
          - extract_recipe
      payload:
          recipeId: "{{ recipeId }}"

    - name: sync_recipe
      processor: SyncRecipe
      depends_on:
          - generate_hero
      payload:
          recipeId: "{{ recipeId }}"

    - name: categorize_ingredients
      processor: CategorizeIngredients
      depends_on:
          - sync_recipe
      payload:
          recipeId: "{{ recipeId }}"

    - name: categorize_recipe
      processor: CategorizeRecipe
      depends_on:
          - categorize_ingredients
      payload:
          recipeId: "{{ recipeId }}"

    - name: recipe_ready
      processor: RecipeReady
      depends_on:
          - categorize_recipe
      payload:
          recipeId: "{{ recipeId }}"
    - name: complete_import_report
      processor: CompleteRecipeImportReport
      depends_on:
          - recipe_ready
      payload:
          recipeId: "{{ recipeId }}"
