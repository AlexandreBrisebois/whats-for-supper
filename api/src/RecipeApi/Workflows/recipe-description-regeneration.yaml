name: recipe-description-regeneration
parameters:
    - recipeId
tasks:
    - name: generate_description
      processor: GenerateDescription
      payload:
          recipeId: "{{ recipeId }}"
    - name: sync_recipe
      processor: SyncRecipe
      depends_on:
          - generate_description
      payload:
          recipeId: "{{ recipeId }}"

    - name: classify_dietary_profile
      processor: ClassifyDietaryProfile
      depends_on:
          - sync_recipe
      payload:
          recipeId: "{{ recipeId }}"
          forceReclassify: true
