version: 2
updates:
  # .NET (api)
  - package-ecosystem: "nuget"
    directory: "/api/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # Node.js (pwa)
  - package-ecosystem: "npm"
    directory: "/pwa/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # eslint-config-next's current parser/plugin set is incompatible with ESLint 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
