name: Build and smoke release images

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-smoke:
    name: Containers — build & smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      WFS_SMOKE_IMAGES: ${{ github.workspace }}/.task/container-candidate/compose.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve candidate identity
        id: identity
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          revision="$(git rev-parse HEAD)"
          channel="$REQUESTED_CHANNEL"
          if [ -z "$channel" ]; then
            channel=beta
            if [ "$SOURCE_BRANCH" = main ]; then channel=stable; fi
          fi
          case "$channel" in stable|beta) ;; *) exit 1 ;; esac
          echo "REVISION=$revision" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build api candidate
        uses: docker/build-push-action@v7
        with:
          context: ./api
          target: production
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wfs-ci-api:${{ steps.identity.outputs.revision }}-${{ steps.identity.outputs.channel }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            io.whats-for-supper.channel=${{ steps.identity.outputs.channel }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
      - name: Build pwa candidate
        uses: docker/build-push-action@v7
        with:
          context: ./pwa
          target: production
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wfs-ci-pwa:${{ steps.identity.outputs.revision }}-${{ steps.identity.outputs.channel }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            io.whats-for-supper.channel=${{ steps.identity.outputs.channel }}
          cache-from: type=gha,scope=pwa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pwa-${{ matrix.arch }}
          build-args: WFS_RELEASE_CHANNEL=${{ steps.identity.outputs.channel }}
      - name: Build migration candidate
        uses: docker/build-push-action@v7
        with:
          context: ./api/database
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wfs-ci-migration:${{ steps.identity.outputs.revision }}-${{ steps.identity.outputs.channel }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            io.whats-for-supper.channel=${{ steps.identity.outputs.channel }}
          cache-from: type=gha,scope=migration-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=migration-${{ matrix.arch }}
      - name: Pin Compose to built image references
        run: python3 -B scripts/ci/image-candidate.py compose
      - name: Install smoke runner dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Smoke exact candidate images without rebuilding
        run: python3 -B scripts/agent/docker_smoke.py
      - name: Archive verified images and identity
        run: python3 -B scripts/ci/image-candidate.py archive
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: container-candidate-v1-${{ steps.identity.outputs.channel }}-${{ matrix.arch }}
          path: |
            .task/container-candidate/*.tar
            .task/container-candidate/candidate.json
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
      - name: Fallback teardown after runner cancellation
        if: always()
        run: |
          if [ -f "$WFS_SMOKE_IMAGES" ]; then
            python3 -B scripts/agent/docker_smoke.py --down
          fi
