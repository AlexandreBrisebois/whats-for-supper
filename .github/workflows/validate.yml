  pwa-validate:
    name: PWA — validate
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - name: Formatting check
        run: npm run format:check
        working-directory: pwa
      - name: Type-check
        run: npm run typecheck
        working-directory: pwa
      - name: Lint
        run: npm run lint
        working-directory: pwa
      - name: Unit tests
        run: npm run test:unit
        working-directory: pwa

  contract-integrity:
    name: Integrity Gate — Contract Parity
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Verify API ↔ Spec ↔ Mock parity
        run: python3 scripts/agent/api_tools.py
        env:
          SPEC_PATH: specs/openapi.yaml
      - name: Schema drift — Tier 1 (spec vs C# DTOs)
        run: python3 scripts/agent/drift.py --schema-only

  pwa-build:
    name: PWA — build once for E2E
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - name: Check capability suite inventory
        run: |
          npm install --global @go-task/cli@3.54.0
          node --test scripts/ci/*.test.cjs
      - name: Build PWA
        run: node ../scripts/ci/production-browser.cjs build
        working-directory: pwa
      - name: Archive production build (including hidden Next files)
        run: tar -cf "$RUNNER_TEMP/pwa-build.tar" -C pwa .next
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: pwa-e2e-build
          path: ${{ runner.temp }}/pwa-build.tar
          compression-level: 0
          retention-days: 1

  pwa-e2e:
    name: PWA — E2E (${{ matrix.suite }})
    needs: [changes, pwa-build, pwa-validate, contract-integrity]
    if: >-
      !cancelled() && needs.changes.outputs.pwa == 'true' &&
      needs.pwa-build.result == 'success' && needs.pwa-validate.result == 'success' &&
      (needs.contract-integrity.result == 'success' || needs.contract-integrity.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.e2e-suites) }}
    env:
      CI: true
      HEARTH_SECRET: Paris-Montreal
      WFS_E2E_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - uses: actions/download-artifact@v8
        with:
          name: pwa-e2e-build
          path: ${{ runner.temp }}
      - name: Restore production build
        run: tar -xf "$RUNNER_TEMP/pwa-build.tar" -C pwa
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: pwa
      - name: Run capability suite
        run: node ../scripts/ci/production-browser.cjs run --suites "$WFS_E2E_SUITE"
        working-directory: pwa
      - name: Public Demo Welcome regression
        if: matrix.suite == 'household'
        run: npm run test:e2e -- --config=e2e/welcome-demo.playwright.config.ts --output=test-results/welcome-demo
        working-directory: pwa
        env:
          WFS_WELCOME_DEMO: 'true'
          WFS_WELCOME_SECRET: Swipe-Match-Cook
      - name: Beta Welcome and Home regression
        if: matrix.suite == 'household'
        working-directory: pwa
        env:
          WFS_WELCOME_CHANNEL: beta
          WFS_WELCOME_DEV: 'true'
          WFS_WELCOME_DEMO: 'false'
          WFS_WELCOME_SECRET: Synthetic-Beta-Family
          HEARTH_SECRET: Synthetic-Beta-Family
          NEXT_PUBLIC_ENVIRONMENT: test
        run: |
          beta_channel_source=src/lib/server/release-channel.json
          beta_channel_backup="$RUNNER_TEMP/beta-release-channel.json"
          cp "$beta_channel_source" "$beta_channel_backup"
          trap 'cp "$beta_channel_backup" "$beta_channel_source"' EXIT
          printf '{ "channel": "beta" }\n' > "$beta_channel_source"
          npm run test:e2e -- --config=e2e/welcome-demo.playwright.config.ts --grep 'Beta context' --output=test-results/beta-context
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: playwright-${{ matrix.suite }}
          path: |
            pwa/blob-report/
            pwa/test-results/
          if-no-files-found: error
          retention-days: 7

  pwa-e2e-report:
    name: PWA — combined E2E report
    needs: pwa-e2e
    if: ${{ !cancelled() && needs.pwa-e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-*
          path: ${{ runner.temp }}/playwright
      - name: Gather uniquely named blob reports
        run: |
          mkdir -p pwa/all-blob-reports
          find "$RUNNER_TEMP/playwright" -path '*/blob-report/*.zip' -exec cp {} pwa/all-blob-reports/ \;
      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: pwa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: playwright-report
          path: pwa/playwright-report/
          retention-days: 7

  pwa-e2e-gate:
    # Keep the original required-check name stable across the matrix transition.
    name: PWA — build & E2E
    needs: [changes, pwa-build, pwa-e2e, pwa-e2e-report]
    if: ${{ !cancelled() && needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the build, every suite and merged report
        env:
          BUILD: ${{ needs.pwa-build.result }}
          SUITES: ${{ needs.pwa-e2e.result }}
          REPORT: ${{ needs.pwa-e2e-report.result }}
        run: test "$BUILD" = success && test "$SUITES" = success && test "$REPORT" = success

  docker-smoke:
    name: Database & container changes — smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !inputs.skip-docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Install smoke runner dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Build and smoke the disposable database stack
        run: python3 -B scripts/agent/docker_smoke.py
      - name: Fallback teardown
        if: always()
        run: python3 -B scripts/agent/docker_smoke.py --down
