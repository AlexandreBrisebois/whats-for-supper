name: Validate

on:
  workflow_call:
    inputs:
      full-validation:
        description: Run every validation job regardless of changed paths.
        required: false
        default: false
        type: boolean
      skip-docker-smoke:
        description: Release packaging owns smoke checks on its exact images.
        required: false
        default: false
        type: boolean
      ref:
        description: Commit or tag to validate. Defaults to the triggering SHA.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  spec-validate:
    name: OpenSpec — validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_VERSION: '1.14.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned OpenSpec CLI
        run: npm install --global "@fission-ai/openspec@${OPENSPEC_VERSION}"
      - name: Verify CLI version
        run: test "$(openspec --version)" = "$OPENSPEC_VERSION"
      - name: Validate capability specs and changes
        run: openspec validate --all --strict --no-interactive

  changes:
    name: Determine affected validation
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      pwa: ${{ steps.filter.outputs.pwa }}
      contract: ${{ steps.filter.outputs.contract }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e-suites: ${{ steps.filter.outputs.e2e-suites }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: filter
        env:
          FULL_VALIDATION: ${{ inputs.full-validation }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$FULL_VALIDATION" = 'true' ] || { [ "$EVENT_NAME" != 'pull_request' ] && [ "$EVENT_NAME" != 'push' ]; }; then
            files='all files selected'
            export FULL_VALIDATION=true
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            files="$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            files="$(git diff --no-renames --name-only "$BEFORE" HEAD)"
          else
            files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          matches() { printf '%s\n' "$files" | grep -Eq "$1"; }
          selected() {
            if [ "$FULL_VALIDATION" = 'true' ] || matches "$1"; then echo true; else echo false; fi
          }
          echo "pipeline=$(selected '^(\.github/workflows/|scripts/ci/|pwa/playwright\.config\.ts$|scripts/agent/(docker_smoke|dockerhub_release|install_identity)\.py$|scripts/agent/tests/(test_ci_candidates|test_docker_smoke|test_dockerhub_release|test_workflow_security|test_install_identity)\.py$)')" >> "$GITHUB_OUTPUT"
          echo "e2e-suites=$(printf '%s\n' "$files" | node scripts/ci/select-e2e.cjs)" >> "$GITHUB_OUTPUT"
          echo "api=$(selected '^(api/|specs/openapi\.yaml$|scripts/requirements\.txt$|scripts/agent/(api_tools|drift)\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "pwa=$(selected '^(pwa/|\.nvmrc$|scripts/ci/|specs/openapi\.yaml$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "contract=$(selected '^(api/|pwa/|specs/openapi\.yaml$|scripts/requirements\.txt$|scripts/agent/(api_tools|drift)\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "docker=$(selected '^(api/database/|api/src/RecipeApi/(Data|Models)/|api/Dockerfile$|pwa/Dockerfile$|docker/|release-template/synology/compose\.yaml$|Taskfile\.yml$|scripts/requirements\.txt$|scripts/agent/docker_smoke\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  pipeline-tests:
    name: Pipeline — regression checks
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install tooling test dependency
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Test pipeline selection, smoke and release boundaries
        run: |
          node --test scripts/ci/*.test.cjs
          python3 -B -m unittest scripts.agent.tests.test_ci_candidates scripts.agent.tests.test_docker_smoke scripts.agent.tests.test_dockerhub_release scripts.agent.tests.test_workflow_security scripts.agent.tests.test_install_identity

  api-validate:
    name: API — validate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up .NET 11 Preview
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore dependencies
        run: dotnet restore src/RecipeApi.Tests/RecipeApi.Tests.csproj
        working-directory: api
      - name: Lint (C#)
        run: dotnet format --verify-no-changes --verbosity diagnostic
        working-directory: api
      - name: Build
        run: dotnet build src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-restore --configuration Release
        working-directory: api

  api-test:
    name: API — test
    needs: [changes, api-validate]
    if: needs.changes.outputs.api == 'true' && needs.api-validate.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: recipe_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up .NET 11 Preview
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore dependencies
        run: dotnet restore src/RecipeApi.Tests/RecipeApi.Tests.csproj
        working-directory: api
      - name: Build
        run: dotnet build src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-restore --configuration Release
        working-directory: api
      - name: Test
        run: >
          dotnet test src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
        working-directory: api
        env:
          POSTGRES_CONNECTION_STRING: postgres://recipe_app:ci_password@localhost:5432/recipe_app_test
          WFS_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=recipe_app_test;Username=recipe_app;Password=ci_password
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: api-test-results
          path: api/test-results/*.trx

  pwa-validate:
    name: PWA — validate
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - name: Formatting check
        run: npm run format:check
        working-directory: pwa
      - name: Type-check
        run: npm run typecheck
        working-directory: pwa
      - name: Lint
        run: npm run lint
        working-directory: pwa
      - name: Unit tests
        run: npm run test:unit
        working-directory: pwa

  contract-integrity:
    name: Integrity Gate — Contract Parity
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Verify API ↔ Spec ↔ Mock parity
        run: python3 scripts/agent/api_tools.py
        env:
          SPEC_PATH: specs/openapi.yaml
      - name: Schema drift — Tier 1 (spec vs C# DTOs)
        run: python3 scripts/agent/drift.py --schema-only

  pwa-build:
    name: PWA — build once for E2E
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - name: Check capability suite inventory
        run: node --test scripts/ci/*.test.cjs
      - name: Build PWA
        run: npm run build
        working-directory: pwa
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5001
          API_INTERNAL_URL: http://127.0.0.1:5001
          NEXT_PUBLIC_ENABLE_AGENT_SEARCH: true
          NEXT_PUBLIC_ENABLE_PHOTO_SEARCH: true
      - name: Archive production build (including hidden Next files)
        run: tar -cf "$RUNNER_TEMP/pwa-build.tar" -C pwa .next
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: pwa-e2e-build
          path: ${{ runner.temp }}/pwa-build.tar
          compression-level: 0
          retention-days: 1

  pwa-e2e:
    name: PWA — E2E (${{ matrix.suite }})
    needs: [changes, pwa-build, pwa-validate, contract-integrity]
    if: >-
      !cancelled() && needs.changes.outputs.pwa == 'true' &&
      needs.pwa-build.result == 'success' && needs.pwa-validate.result == 'success' &&
      (needs.contract-integrity.result == 'success' || needs.contract-integrity.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.e2e-suites) }}
    env:
      CI: true
      HEARTH_SECRET: Paris-Montreal
      WFS_E2E_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - uses: actions/download-artifact@v8
        with:
          name: pwa-e2e-build
          path: ${{ runner.temp }}
      - name: Restore production build
        run: tar -xf "$RUNNER_TEMP/pwa-build.tar" -C pwa
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: pwa
      - name: Run capability suite
        run: npm run test:e2e
        working-directory: pwa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: playwright-${{ matrix.suite }}
          path: |
            pwa/blob-report/
            pwa/test-results/
          if-no-files-found: error
          retention-days: 7

  pwa-e2e-report:
    name: PWA — combined E2E report
    needs: pwa-e2e
    if: ${{ !cancelled() && needs.pwa-e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-*
          path: ${{ runner.temp }}/playwright
      - name: Gather uniquely named blob reports
        run: |
          mkdir -p pwa/all-blob-reports
          find "$RUNNER_TEMP/playwright" -path '*/blob-report/*.zip' -exec cp {} pwa/all-blob-reports/ \;
      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: pwa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: playwright-report
          path: pwa/playwright-report/
          retention-days: 7

  pwa-e2e-gate:
    # Keep the original required-check name stable across the matrix transition.
    name: PWA — build & E2E
    needs: [changes, pwa-build, pwa-e2e, pwa-e2e-report]
    if: ${{ !cancelled() && needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the build, every suite and merged report
        env:
          BUILD: ${{ needs.pwa-build.result }}
          SUITES: ${{ needs.pwa-e2e.result }}
          REPORT: ${{ needs.pwa-e2e-report.result }}
        run: test "$BUILD" = success && test "$SUITES" = success && test "$REPORT" = success

  docker-smoke:
    name: Database & container changes — smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !inputs.skip-docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Install smoke runner dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Build and smoke the disposable database stack
        run: python3 -B scripts/agent/docker_smoke.py
      - name: Fallback teardown
        if: always()
        run: python3 -B scripts/agent/docker_smoke.py --down
