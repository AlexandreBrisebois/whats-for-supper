name: Validate

on:
  workflow_call:
    inputs:
      full-validation:
        description: Run every validation job regardless of changed paths.
        required: false
        default: false
        type: boolean
      skip-docker-smoke:
        description: Release packaging owns smoke checks on its exact images.
        required: false
        default: false
        type: boolean
      ref:
        description: Commit or tag to validate. Defaults to the triggering SHA.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  spec-validate:
    name: OpenSpec — validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_VERSION: '1.17.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install pinned OpenSpec CLI
        run: npm install --global "@fission-ai/openspec@${OPENSPEC_VERSION}"
      - name: Verify CLI version
        run: test "$(openspec --version)" = "$OPENSPEC_VERSION"
      - name: Validate capability specs and changes
        run: openspec validate --all --strict --no-interactive

  changes:
    name: Determine affected validation
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      pwa: ${{ steps.filter.outputs.pwa }}
      contract: ${{ steps.filter.outputs.contract }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e-suites: ${{ steps.filter.outputs.e2e-suites }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: filter
        env:
          FULL_VALIDATION: ${{ inputs.full-validation }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$FULL_VALIDATION" = 'true' ] || { [ "$EVENT_NAME" != 'pull_request' ] && [ "$EVENT_NAME" != 'push' ]; }; then
            files='all files selected'
            export FULL_VALIDATION=true
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            files="$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            files="$(git diff --no-renames --name-only "$BEFORE" HEAD)"
          else
            files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          matches() { printf '%s\n' "$files" | grep -Eq "$1"; }
          selected() {
            if [ "$FULL_VALIDATION" = 'true' ] || matches "$1"; then echo true; else echo false; fi
          }
          echo "pipeline=$(selected '^(\.github/workflows/|scripts/ci/|scripts/release/|release-template/synology/|pwa/playwright\.config\.ts$|scripts/agent/(docker_smoke|dockerhub_release|install_identity)\.py$|scripts/agent/tests/(test_ci_candidates|test_docker_smoke|test_dockerhub_release|test_workflow_security|test_install_identity|test_install_bundle)\.py$)')" >> "$GITHUB_OUTPUT"
          echo "e2e-suites=$(printf '%s\n' "$files" | node scripts/ci/select-e2e.cjs)" >> "$GITHUB_OUTPUT"
          echo "api=$(selected '^(api/|specs/openapi\.yaml$|scripts/requirements\.txt$|scripts/agent/(api_tools|drift)\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "pwa=$(selected '^(pwa/|\.nvmrc$|scripts/ci/|specs/openapi\.yaml$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "contract=$(selected '^(api/|pwa/|specs/openapi\.yaml$|scripts/requirements\.txt$|scripts/agent/(api_tools|drift)\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "docker=$(selected '^(api/database/|api/src/RecipeApi/(Data|Models)/|api/Dockerfile$|pwa/Dockerfile$|docker/|release-template/synology/compose\.yaml$|Taskfile\.yml$|scripts/requirements\.txt$|scripts/agent/docker_smoke\.py$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  pipeline-tests:
    name: Pipeline — regression checks
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install tooling test dependency
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Install Task for command regression tests
        run: npm install --global @go-task/cli@3.54.0
      - name: Test pipeline selection, smoke and release boundaries
        run: |
          node --test scripts/ci/*.test.cjs
          python3 -B -m unittest scripts.agent.tests.test_install_bundle -v
          python3 -B -m unittest scripts.agent.tests.test_ci_candidates scripts.agent.tests.test_docker_smoke scripts.agent.tests.test_dockerhub_release scripts.agent.tests.test_workflow_security scripts.agent.tests.test_install_identity

  api-validate:
    name: API — validate
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up .NET 11 Preview
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore dependencies
        run: dotnet restore src/RecipeApi.Tests/RecipeApi.Tests.csproj
        working-directory: api
      - name: Lint (C#)
        run: dotnet format --verify-no-changes --verbosity diagnostic
        working-directory: api
      - name: Build
        run: dotnet build src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-restore --configuration Release
        working-directory: api

  api-test:
    name: API — test
    needs: [changes, api-validate]
    if: needs.changes.outputs.api == 'true' && needs.api-validate.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: recipe_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up .NET 11 Preview
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore dependencies
        run: dotnet restore src/RecipeApi.Tests/RecipeApi.Tests.csproj
        working-directory: api
      - name: Build
        run: dotnet build src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-restore --configuration Release
        working-directory: api
      - name: Test
        run: >
          dotnet test src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
        working-directory: api
        env:
          POSTGRES_CONNECTION_STRING: postgres://recipe_app:ci_password@localhost:5432/recipe_app_test
          WFS_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=recipe_app_test;Username=recipe_app;Password=ci_password
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: api-test-results
          path: api/test-results/*.trx

  cooking-step-live:
    name: Cooking steps — real API & PostgreSQL browser
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: recipe_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: recipe_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipe_app -d recipe_app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WFS_CALENDAR_LIVE: '1'
      WFS_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=recipe_app_test;Username=recipe_app;Password=ci_password
      NEXT_PUBLIC_ENVIRONMENT: test
      NEXT_PUBLIC_API_BASE_URL: ''
      API_INTERNAL_URL: http://127.0.0.1:1
      NEXT_TELEMETRY_DISABLED: '1'
      HEARTH_SECRET: test-hearth-secret
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.100-rc.2.26504.105
            10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.21.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Task for live endpoint parity
        run: npm install --global @go-task/cli@3.54.0
      - name: Initialize repository Python tooling
        run: task init:python
      - name: Install PWA dependencies
        run: npm ci
        working-directory: pwa
      - name: Restore pinned .NET tools
        run: dotnet tool restore
      - name: Verify generated client
        run: python3 -B scripts/agent/kiota_client.py check
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: pwa
      # Mocked suites compile a fixed API origin; live fixtures require relative
      # requests so each test owns its random-port authenticated API and database.
      - name: Build isolated live PWA
        run: npm run build -- --webpack
        working-directory: pwa
      - name: Run required cooking live scenarios
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName~LiveBrowser_CookingStep|FullyQualifiedName~LiveBrowser_CookingReportRefresh"
          --logger "trx;LogFileName=cooking-live.trx" --results-directory .task/cooking-live
        env:
          WFS_CANONICAL_BROWSER_ROOT: ${{ github.workspace }}
          WFS_CANONICAL_EVIDENCE: ${{ github.workspace }}/.task/cooking-live
      - name: Require all cooking live results
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          required = {'LiveBrowser_CookingStepScaling', 'LiveBrowser_CookingStepSplitOil', 'LiveBrowser_CookingStepPartial', 'LiveBrowser_CookingStepExhaustiveReduction', 'LiveBrowser_CookingReportRefresh', 'LiveBrowser_CookingStepInstructionGuard', 'LiveBrowser_CookingStepFraction', 'LiveBrowser_CookingStepRemainder', 'LiveBrowser_CookingStepPerItem', 'LiveBrowser_CookingStepFixed', 'LiveBrowser_CookingStepPreparedSix', 'LiveBrowser_CookingStepPreparedOriginal'}
          results = ET.parse('.task/cooking-live/cooking-live.trx').getroot().findall('.//{*}UnitTestResult')
          assert len(results) == len(required), 'Required cooking live cases were not all executed'
          assert {result.get('testName').rsplit('.', 1)[-1] for result in results} == required
          assert all(result.get('outcome') == 'Passed' for result in results), 'Cooking live cases must pass without skips'
          PY
      - name: Run required prepared context live
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.PreparedSupperPostgresTests.LiveBrowser_PreparedSupperGeneratedClientAndTwoClientUpdates"
          --logger "trx;LogFileName=native.trx" --results-directory .task/cooking-context-live/prepared
        env:
          WFS_LIVE_ARTIFACT_ROOT: ${{ github.workspace }}/.task/cooking-context-live/prepared
      - name: Run required servings context live
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.SupperServingsPostgresTests.LiveBrowser_SupperServingsGeneratedClientAndTwoClientUpdates"
          --logger "trx;LogFileName=native.trx" --results-directory .task/cooking-context-live/servings
        env:
          WFS_LIVE_ARTIFACT_ROOT: ${{ github.workspace }}/.task/cooking-context-live/servings
      - name: Require all cooking context live results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/cooking-context-live')
          for directory, owner in [
              ('prepared', 'LiveBrowser_PreparedSupperGeneratedClientAndTwoClientUpdates'),
              ('servings', 'LiveBrowser_SupperServingsGeneratedClientAndTwoClientUpdates'),
          ]:
              results = ET.parse(root / directory / 'native.trx').getroot().findall('.//{*}UnitTestResult')
              assert len(results) == 1 and results[0].get('testName').rsplit('.', 1)[-1] == owner, f'Missing exact native owner: {owner}'
              assert results[0].get('outcome') == 'Passed', f'Required native owner must pass: {owner}'
          prepared = {'generated prepare persists Friday receipt, actual Tuesday history, raw SSE and mounted independent display; ordinary backup retains browser receipt'} | {
              f'real {fault} preparation boundary preserves authoritative outcome and cooking work without blind replay'
              for fault in ['lost', 'unavailable', 'negative', 'changed', 'recreated', 'publisher']
          }
          reports = [
              ('prepared/prepared-browser.json', prepared, {'canonical prepared correction retains recorded context through coherent refresh'}),
              ('servings/original-browser.json', {'real dated detail, cooking and groceries share inputs across two independent clients'}, set()),
              ('servings/recovery-browser.json', {'real lost portions, failed worker, guarded checks, baselines and movement converge'}, set()),
          ]
          def collect(suite):
              for spec in suite.get('specs', []):
                  for test in spec['tests']:
                      yield spec['title'], test
              for child in suite.get('suites', []):
                  yield from collect(child)
          for name, required, optional in reports:
              report = json.loads((root / name).read_text())
              tests = list(collect(report))
              assert len(tests) == len(required | optional) and {title for title, _ in tests} == required | optional, f'Missing/extra browser cases: {name}'
              for title, test in tests:
                  results = test['results']
                  assert len(results) == 1 and results[0].get('retry', 0) == 0, f'Retries are not acceptance: {title}'
                  if title in optional:
                      # The canonical branch needs its own fixture and is required separately
                      # by CookingStepPreparedSix/Original in the unchanged twelve-case guard.
                      assert test['status'] == 'skipped' and results[0]['status'] == 'skipped', f'Unexpected optional fixture context: {title}'
                  else:
                      assert test['status'] == 'expected' and results[0]['status'] == 'passed', f'Required browser must pass without skips: {title}'
          print('Required context acceptance: 2 native owners, 9 browser passes, 1 explicitly gated canonical branch; zero required skips/retries.')
          PYGUARD
      - name: Run required grocery checks live
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.GroceryCheckConcurrencyPostgresTests.LiveBrowser_IndependentWaterRowsConvergeAndRejectOlderSnapshot"
          --logger "trx;LogFileName=native.trx" --results-directory .task/grocery-live/checks
        env:
          WFS_LIVE_ARTIFACT_ROOT: ${{ github.workspace }}/.task/grocery-live/checks
      - name: Require grocery checks live results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/grocery-live/checks')
          owner = 'RecipeApi.Tests.Integration.GroceryCheckConcurrencyPostgresTests.LiveBrowser_IndependentWaterRowsConvergeAndRejectOlderSnapshot'
          native = ET.parse(root / 'native.trx').getroot().findall('.//{*}UnitTestResult')
          assert len(native) == 1 and native[0].get('testName') == owner, 'Missing exact grocery native owner'
          assert native[0].get('outcome') == 'Passed', 'Grocery native owner must pass without skips'
          def collect(suite):
              for spec in suite.get('specs', []):
                  for test in spec['tests']:
                      yield spec['title'], test
              for child in suite.get('suites', []):
                  yield from collect(child)
          report = json.loads((root / 'browser.json').read_text())
          tests = [item for suite in report['suites'] for item in collect(suite)]
          expected = 'independent water checks converge and an older snapshot cannot restore stale checks'
          assert len(tests) == 1 and tests[0][0] == expected, 'Missing/extra grocery browser results'
          test = tests[0][1]
          assert test['status'] == 'expected' and len(test['results']) == 1, 'Grocery browser must pass once'
          result = test['results'][0]
          assert result['status'] == 'passed' and result.get('retry', 0) == 0, 'Grocery browser skips/retries are not acceptance'
          print('Required grocery checks: 1 native owner, 1 browser journey; zero skips/retries.')
          PYGUARD
      - name: Run required grocery canonical dependencies
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.CanonicalIngredientEditPostgresTests.LiveBrowser_CanonicalIngredientCorrection|FullyQualifiedName=RecipeApi.Tests.Integration.CanonicalIngredientEditPostgresTests.LiveBrowser_CanonicalMixedIncompleteBaseline"
          --logger "trx;LogFileName=native.trx" --results-directory .task/grocery-live/canonical
        env:
          WFS_CANONICAL_BROWSER_ROOT: ${{ github.workspace }}
          WFS_CANONICAL_EVIDENCE: ${{ github.workspace }}/.task/grocery-live/canonical
      - name: Require grocery canonical dependency results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/grocery-live/canonical')
          owners = {'RecipeApi.Tests.Integration.CanonicalIngredientEditPostgresTests.' + name for name in ['LiveBrowser_CanonicalIngredientCorrection', 'LiveBrowser_CanonicalMixedIncompleteBaseline']}
          native = ET.parse(root / 'native.trx').getroot().findall('.//{*}UnitTestResult')
          assert len(native) == len(owners) and {result.get('testName') for result in native} == owners, 'Missing/extra canonical grocery native owners'
          assert all(result.get('outcome') == 'Passed' for result in native), 'Canonical grocery owners must pass without skips'
          def collect(suite):
              for spec in suite.get('specs', []):
                  for test in spec['tests']:
                      yield spec['title'], test
              for child in suite.get('suites', []):
                  yield from collect(child)
          for folder, title in [
              ('correction', 'original correction, refresh recovery and concurrent grocery checks use the real generated client API and database'),
              ('mixed', 'mixed incomplete baseline keeps its grocery check when unknown demand becomes known while a separate proven increase resets'),
          ]:
              report = json.loads((root / folder / 'browser-results.json').read_text())
              tests = list(collect(report))
              assert len(tests) == 1 and tests[0][0] == title, f'Missing/extra canonical grocery browser: {folder}'
              test = tests[0][1]
              assert test['status'] == 'expected' and len(test['results']) == 1, f'Required browser must pass once: {folder}'
              result = test['results'][0]
              assert result['status'] == 'passed' and result.get('retry', 0) == 0, f'Browser skips/retries are not acceptance: {folder}'
          print('Required grocery canonical dependencies: 2 native owners, 2 browser journeys; zero skips/retries.')
          PYGUARD
      - name: Run required fresh URL canonical journey
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.CanonicalIngredientPublicationPostgresTests.LiveBrowser_FreshUrlCanonicalGroceries"
          --logger "trx;LogFileName=native.trx" --results-directory .task/grocery-live/fresh-url
        env:
          WFS_CANONICAL_BROWSER_ROOT: ${{ github.workspace }}
          WFS_CANONICAL_EVIDENCE: ${{ github.workspace }}/.task/grocery-live/fresh-url
      - name: Require fresh URL canonical journey results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/grocery-live/fresh-url')
          native = ET.parse(root / 'native.trx').getroot().findall('.//{*}UnitTestResult')
          owner = 'RecipeApi.Tests.Integration.CanonicalIngredientPublicationPostgresTests.LiveBrowser_FreshUrlCanonicalGroceries'
          assert len(native) == 1 and native[0].get('testName') == owner and native[0].get('outcome') == 'Passed', 'Fresh URL native owner must pass without skips'
          def collect(suite):
              for spec in suite.get('specs', []):
                  for test in spec['tests']:
                      yield spec['title'], test
              for child in suite.get('suites', []):
                  yield from collect(child)
          report = json.loads((root / 'fresh-url' / 'browser-results.json').read_text())
          tests = [item for suite in report['suites'] for item in collect(suite)]
          expected = {
              'fresh URL canonical edit reaches two shoppers and dated groceries',
              'fresh photo canonical edit keeps original media and reaches dated groceries',
              'retained URL material becomes Ready after browser correction and reviewed import',
          }
          assert len(tests) == 3 and {title for title, _ in tests} == expected, 'Missing/extra fresh URL/photo browser results'
          assert all(test['status'] == 'expected' and len(test['results']) == 1
              and test['results'][0]['status'] == 'passed' and test['results'][0].get('retry', 0) == 0
              for _, test in tests), 'Fresh URL browser skips/retries are not acceptance'
          print('Required fresh URL/photo checks: 1 native owner, 3 browser journeys; zero skips/retries.')
          PYGUARD
      - name: Run required absolute-use canonical journey
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.CanonicalIngredientPublicationPostgresTests.LiveBrowser_FreshAbsoluteCanonicalGroceries"
          --logger "trx;LogFileName=native.trx" --results-directory .task/grocery-live/absolute
        env:
          WFS_CANONICAL_BROWSER_ROOT: ${{ github.workspace }}
          WFS_CANONICAL_EVIDENCE: ${{ github.workspace }}/.task/grocery-live/absolute
      - name: Require absolute-use canonical journey results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/grocery-live/absolute')
          native = ET.parse(root / 'native.trx').getroot().findall('.//{*}UnitTestResult')
          owner = 'RecipeApi.Tests.Integration.CanonicalIngredientPublicationPostgresTests.LiveBrowser_FreshAbsoluteCanonicalGroceries'
          assert len(native) == 1 and native[0].get('testName') == owner and native[0].get('outcome') == 'Passed', 'Fresh URL native owner must pass without skips'
          def collect(suite):
              for spec in suite.get('specs', []):
                  for test in spec['tests']:
                      yield spec['title'], test
              for child in suite.get('suites', []):
                  yield from collect(child)
          report = json.loads((root / 'fresh-absolute' / 'browser-results.json').read_text())
          tests = [item for suite in report['suites'] for item in collect(suite)]
          expected = {
              'fresh URL canonical edit reaches two shoppers and dated groceries',
              'fresh photo canonical edit keeps original media and reaches dated groceries',
              'retained URL material becomes Ready after browser correction and reviewed import',
          }
          assert len(tests) == 3 and {title for title, _ in tests} == expected, 'Missing/extra fresh URL/photo browser results'
          assert all(test['status'] == 'expected' and len(test['results']) == 1
              and test['results'][0]['status'] == 'passed' and test['results'][0].get('retry', 0) == 0
              for _, test in tests), 'Fresh URL browser skips/retries are not acceptance'
          print('Required absolute-use URL/photo checks: 1 native owner, 3 browser journeys; zero skips/retries.')
          PYGUARD
      - name: Run required multiple-absolute-use canonical journey
        run: >-
          dotnet test api/src/RecipeApi.Tests/RecipeApi.Tests.csproj
          --filter "FullyQualifiedName=RecipeApi.Tests.Integration.CanonicalIngredientPublicationPostgresTests.LiveBrowser_FreshMultipleAbsoluteCanonicalGroceries"
          --logger "trx;LogFileName=native.trx" --results-directory .task/grocery-live/multiple-absolute
        env:
          WFS_CANONICAL_BROWSER_ROOT: ${{ github.workspace }}
          WFS_CANONICAL_EVIDENCE: ${{ github.workspace }}/.task/grocery-live/multiple-absolute
      - name: Require multiple-absolute-use canonical journey results
        run: |
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.task/grocery-live/multiple-absolute')
