name: Publish Docker Hub Images

on:
  push:
    tags:
      - 'dockerhub/v*'

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-tag:
    name: Validate Docker Hub trigger tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      revision: ${{ steps.validate.outputs.revision }}
      channel: ${{ steps.channel.outputs.channel }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate annotated tag and release branch policy
        id: validate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          if ! [[ "$TAG" =~ ^dockerhub/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]]; then
            echo "Rejected Docker Hub tag grammar: $TAG" >&2
            exit 1
          fi

          if ! tag_object="$(git rev-parse -q --verify "refs/tags/$TAG^{tag}")"; then
            echo "Docker Hub releases require the pushed ref to be an annotated tag." >&2
            exit 1
          fi

          tag_commit="$(git cat-file -p "$tag_object" | sed -n '1s/^object //p')"
          if [ -z "$tag_commit" ] || [ "$(git cat-file -t "$tag_commit")" != "commit" ]; then
            echo "Docker Hub release tags must point directly to a commit." >&2
            exit 1
          fi
          VERSION="${TAG#dockerhub/v}"
          if [[ "$VERSION" == *-beta.* ]]; then
            echo "Beta Docker Hub tag accepted from its source branch."
          elif ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Stable Docker Hub tags must point to a commit reachable from origin/main." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Derive PWA release channel
        id: channel
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ ]]; then
            echo "Cannot derive channel from invalid release version: $VERSION" >&2
            exit 1
          fi
          channel=stable
          if [[ "$VERSION" == *-beta.* ]]; then
            channel=beta
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    if: github.actor == vars.DOCKERHUB_PUBLISHER_GITHUB_LOGIN
    uses: ./.github/workflows/validate.yml
    with:
      full-validation: true
      ref: ${{ github.sha }}

  publish-preflight:
    name: Validate Docker Hub publication
    needs: validate-tag
    if: github.actor == vars.DOCKERHUB_PUBLISHER_GITHUB_LOGIN
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Reject existing Docker Hub image tags
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          for image in \
            brisebois/whats-for-supper-api \
            brisebois/whats-for-supper-pwa \
            brisebois/whats-for-supper-db-migration; do
            status="$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/${image}/tags/${VERSION}/" || true)"
            case "$status" in
              404) ;;
              200) echo "Docker Hub image tag already exists: ${image}:${VERSION}" >&2; exit 1 ;;
              *) echo "Could not verify Docker Hub image tag ${image}:${VERSION} (HTTP ${status:-none})." >&2; exit 1 ;;
            esac
          done

  publish:
    name: Build and push Docker Hub images
    needs: [validate-tag, validate, publish-preflight]
    if: github.actor == vars.DOCKERHUB_PUBLISHER_GITHUB_LOGIN
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: brisebois/whats-for-supper-api
            context: ./api
            target: production
          - image: brisebois/whats-for-supper-pwa
            context: ./pwa
            target: production
          - image: brisebois/whats-for-supper-db-migration
            context: ./api/database
            target: ''

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.context == './pwa' && format('WFS_RELEASE_CHANNEL={0}', needs.validate-tag.outputs.channel) || '' }}
          tags: docker.io/${{ matrix.image }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate-tag.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}

  install-bundle:
    name: Publish matching installation ZIP
    needs: [validate-tag, publish]
    if: github.actor == vars.DOCKERHUB_PUBLISHER_GITHUB_LOGIN
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify all published image tags exist
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          for image in api pwa db-migration; do
            repository="brisebois/whats-for-supper-${image}"
            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/${repository}/tags/${VERSION}/" || true)"
              if [ "$status" = 200 ]; then break; fi
              if [ "$attempt" = 5 ]; then echo "Missing image ${repository}:${VERSION} (HTTP $status)" >&2; exit 1; fi
              sleep 15
            done
          done

      - name: Build and validate installation ZIP
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release/build-install-zip.sh "$VERSION" "dist/whats-for-supper-install-${VERSION}.zip"
          unzip -t "dist/whats-for-supper-install-${VERSION}.zip"
          unzip -q "dist/whats-for-supper-install-${VERSION}.zip" -d /tmp/wfs-install-check
          cd /tmp/wfs-install-check/whats-for-supper
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpassword/' \
                 -e 's/^HEARTH_SECRET=.*/HEARTH_SECRET=testsecret/' \
                 -e 's/^GEMINI_API_KEY=.*/GEMINI_API_KEY=testkey/' \
                 -e 's/^CLOUDFLARE_TUNNEL_TOKEN=.*/CLOUDFLARE_TUNNEL_TOKEN=testtoken/' \
                 -e 's/^ELEVATED_ACTIONS_PIN=.*/ELEVATED_ACTIONS_PIN=123456/' .env
          docker compose config --quiet
          rm .env

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="dist/whats-for-supper-install-${VERSION}.zip"
          sha256sum "$asset" > "$asset.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          else
            gh release create "$TAG" "$asset" "$asset.sha256" --title "What's for Supper ${VERSION}" --notes "Docker images and matching Linux Docker Compose installation bundle."
          fi
