default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: whitespace
        name: Staged whitespace
        language: system
        entry: git diff --cached --check
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: openspec
        name: OpenSpec validation
        language: system
        entry: task spec:check
        files: ^(openspec/|\.agents/skills/openspec-|Taskfile\.yml$|\.pre-commit-config\.yaml$)
        stages: [pre-commit]
        pass_filenames: false

      - id: agent-harness
        name: Agent harness tests
        language: system
        entry: task test:agent
        files: ^(scripts/agent/|scripts/requirements\.txt$|\.agents/|Taskfile\.yml$|\.pre-commit-config\.yaml$|\.github/workflows/)
        stages: [pre-commit]
        pass_filenames: false

      - id: contract-static
        name: Static API contract and mock checks
        language: system
        entry: task check:contracts
        files: ^(api/|specs/openapi\.yaml$|pwa/e2e/|scripts/agent/(api_tools|drift|drift_mocks)\.py$)
        stages: [pre-commit]
        pass_filenames: false

      - id: kiota-client-check
        name: Generated API client check
        language: system
        entry: task gen:client:check
        files: ^(specs/openapi\.yaml$|pwa/src/lib/api/generated/|scripts/agent/kiota_client\.py$)
        stages: [pre-commit]
        pass_filenames: false

      - id: pwa-format
        name: PWA formatting check
        language: system
        entry: task format:check:pwa
        files: ^pwa/
        stages: [pre-commit]
        pass_filenames: false
