repos:
  - repo: local
    hooks:
      - id: agent-harness
        name: Agent harness tests
        language: system
        entry: task test:agent
        files: ^(scripts/agent/|\.agents/|Taskfile\.yml$|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: openapi-schema-drift
        name: OpenAPI schema drift (spec vs C# DTOs)
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 scripts/agent/drift.py --schema-only
        files: ^(specs/openapi\.yaml|api/src/RecipeApi/Dto/.+\.cs)$
        pass_filenames: false

      - id: mock-drift-audit
        name: E2E Mock Compliance (Valid GUIDs & Builders)
        language: python
        entry: python3 scripts/agent/drift_mocks.py
        files: ^pwa/e2e/
        pass_filenames: false

      - id: api-review
        name: API Review (Lint & Test)
        language: system
        entry: bash -c "cd api && DOTNET_CLI_HOME=\"${TMPDIR:-$HOME/.dotnet}\" dotnet format RecipeApi.csproj --verify-no-changes --no-restore && DOTNET_CLI_HOME=\"${TMPDIR:-$HOME/.dotnet}\" dotnet test src/RecipeApi.Tests/RecipeApi.Tests.csproj --no-restore"
        files: ^(api/|specs/openapi\.yaml$|\.github/workflows/|\.pre-commit-config\.yaml$)
        pass_filenames: false

      - id: kiota-client-sync
        name: Kiota client sync (Auto-generate)
        language: system
        entry: bash -c "if [ \"$CI\" = \"true\" ] || [ \"$GITHUB_ACTIONS\" = \"true\" ]; then task gen:client:check; else task gen:client:sync; fi"
        files: ^specs/openapi\.yaml$
        pass_filenames: false

      - id: pwa-review
        name: PWA Review (Lint, Types, Unit, Production Build & E2E)
        language: system
        entry: bash -c "cd pwa && npm run lint && npm run typecheck && npm run test:unit && unset BASE_URL && export CI=true NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:5001 API_INTERNAL_URL=http://127.0.0.1:5001 NEXT_PUBLIC_ENABLE_AGENT_SEARCH=true NEXT_PUBLIC_ENABLE_PHOTO_SEARCH=true HEARTH_SECRET=Paris-Montreal && npm run build && npm run test:e2e"
        files: ^(pwa/|specs/openapi\.yaml$|\.github/workflows/|\.pre-commit-config\.yaml$)
        pass_filenames: false
