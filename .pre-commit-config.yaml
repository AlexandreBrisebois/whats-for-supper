repos:
  - repo: local
    hooks:
      - id: openapi-schema-drift
        name: OpenAPI schema drift (spec vs C# DTOs)
        language: python
        additional_dependencies: [pyyaml]
        entry: python3 scripts/agent/drift.py --schema-only
        files: ^(specs/openapi\.yaml|api/src/RecipeApi/Dto/.+\.cs)$
        pass_filenames: false

      - id: mock-drift-audit
        name: E2E Mock Compliance (Valid GUIDs & Builders)
        language: python
        entry: python3 scripts/agent/drift_mocks.py
        files: ^pwa/e2e/
        pass_filenames: false

      - id: api-review
        name: API Review (Lint & Test)
        language: system
        entry: bash -c "cd api && dotnet format --verify-no-changes && dotnet test src/RecipeApi.Tests/RecipeApi.Tests.csproj"
        files: ^api/
        pass_filenames: false

      - id: pwa-review
        name: PWA Review (Lint & Typecheck & Unit Tests)
        language: system
        entry: bash -c "cd pwa && npm run lint && npm run typecheck && npm run test:unit"
        files: ^pwa/
        pass_filenames: false

      - id: kiota-client-check
        name: Kiota client up to date
        language: system
        entry: bash -c "task gen:client:check"
        files: ^specs/openapi\.yaml$
        pass_filenames: false
