services:
  api:
    image: ${WFS_REGISTRY}/whats-for-supper-api:${TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ELEVATED_ACTIONS_PIN: ${ELEVATED_ACTIONS_PIN:-}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-text-embedding-3-small}
      DREAMING_CRON_UTC: "${DREAMING_CRON_UTC:-0 3 * * *}"
      HEARTH_SECRET: ${HEARTH_SECRET}
      CORS__ALLOWED_ORIGINS: https://${DOMAIN_NAME}
    volumes:
      - ${DATA_ROOT:-/data}:/data
    labels:
      # Browser calls ${DOMAIN_NAME}/api/* directly — Traefik forwards to the API container as-is (no strip).
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.middlewares=cf-proto-https"
      # Inject X-Forwarded-Proto: https so ASP.NET UseForwardedHeaders() sees a secure request.
      # Cloudflare terminates TLS and hits Traefik on HTTP/80; without this header the app sees plain HTTP.
      - "traefik.http.middlewares.cf-proto-https.headers.customrequestheaders.X-Forwarded-Proto=https"
    ports:
      - "${API_PORT_EXTERNAL:-9101}:9001"

  pwa:
    image: ${WFS_REGISTRY}/whats-for-supper-pwa:${TAG}
    environment:
      HEARTH_SECRET: ${HEARTH_SECRET}
      NODE_ENV: production
    labels:
      - "traefik.http.routers.pwa.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.pwa.middlewares=cf-proto-https"
    ports:
      - "${PWA_PORT_EXTERNAL:-9102}:3000"

  traefik:
    volumes:
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${TRAEFIK_HTTP_PORT:-9100}:80"
      - "${TRAEFIK_ADMIN_PORT:-9180}:8080"

  # ──────────────────────────────────────────────────────────────────────────
  # Cloudflare Tunnel
  # ──────────────────────────────────────────────────────────────────────────
  cloudflared:
    container_name: whats-for-supper-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy
