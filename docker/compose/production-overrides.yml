services:
  api:
    image: ${WFS_REGISTRY}/whats-for-supper-api:${TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HEARTH_SECRET: ${HEARTH_SECRET}
      CORS__ALLOWED_ORIGINS: https://wfs.srvrlss.dev
    labels:
      traefik.http.routers.api.rule: "Host(`wfs.srvrlss.dev`) && PathPrefix(`/api`)"
      traefik.http.routers.api.middlewares: "cf-proto-https"
      traefik.http.middlewares.cf-proto-https.headers.customrequestheaders.X-Forwarded-Proto: "https"
    ports:
      - "9101:9001"

  pwa:
    image: ${WFS_REGISTRY}/whats-for-supper-pwa:${TAG}
    environment:
      HEARTH_SECRET: ${HEARTH_SECRET}
      NODE_ENV: production
    labels:
      traefik.http.routers.pwa.rule: "Host(`wfs.srvrlss.dev`)"
      traefik.http.routers.pwa.middlewares: "cf-proto-https"
    ports:
      - "9102:3000"

  # ──────────────────────────────────────────────────────────────────────────
  # Cloudflare Tunnel
  # ──────────────────────────────────────────────────────────────────────────
  cloudflared:
    container_name: whats-for-supper-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy
