http:
  middlewares:
    # SSE requires unbuffered responses — disable proxy buffering and caching.
    sse-headers:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: no 
          Cache-Control: no-cache
          Content-Type: text/event-stream
          Connection: keep-alive

  routers:
    api-stream:
      rule: "Host(`pwa.wfs.localhost`) && Path(`/api/stream`)"
      entryPoints:
        - web
      service: api
      middlewares:
        - sse-headers
      priority: 100

    api:
      rule: "Host(`pwa.wfs.localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: api

    pwa:
      rule: "Host(`pwa.wfs.localhost`)"
      entryPoints:
        - web
      service: pwa

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://whats-for-supper-api:9001"
    pwa:
      loadBalancer:
        servers:
          - url: "http://whats-for-supper-pwa:3000"
