http:
  middlewares:
    # SSE requires unbuffered responses — disable proxy buffering and caching.
    sse-headers:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: no 
          Cache-Control: no-cache
          Content-Type: text/event-stream
          Connection: keep-alive

  routers:
    # Dedicated SSE router — Matches both prod and local domains
    api-stream:
      rule: "(Host(`wfs.srvrlss.dev`) || Host(`pwa.wfs.localhost`) || Host(`api.wfs.localhost`)) && Path(`/api/stream`)"
      service: api
      middlewares:
        - sse-headers
      entryPoints: [web]
      priority: 100

    # API traffic: Matches both prod and local domains
    api:
      rule: "(Host(`wfs.srvrlss.dev`) || Host(`pwa.wfs.localhost`)) && PathPrefix(`/api`)"
      service: api
      entryPoints: [web]
      priority: 50

    # PWA traffic: Matches both prod and local domains
    pwa:
      rule: "Host(`wfs.srvrlss.dev`) || Host(`pwa.wfs.localhost`)"
      service: pwa
      entryPoints: [web]
      priority: 10

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:9001"
    pwa:
      loadBalancer:
        servers:
          - url: "http://pwa:3000"
