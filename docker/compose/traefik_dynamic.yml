http:
  middlewares:
    # SSE requires unbuffered responses — disable proxy buffering and caching.
    sse-headers:
      headers:
        customResponseHeaders:
          X-Accel-Buffering: no 
          Cache-Control: no-cache
          Content-Type: text/event-stream
          Connection: keep-alive

  # The sse-headers middleware is referenced by labels in the compose files
  # to ensure EventSource connections are not buffered by Traefik.

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:9001"
    pwa:
      loadBalancer:
        servers:
          - url: "http://pwa:3000"
