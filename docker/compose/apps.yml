services:
  # ──────────────────────────────────────────────────────────────────────────
  # .NET 11 RC1 Recipe API
  # ──────────────────────────────────────────────────────────────────────────
  api:
    container_name: whats-for-supper-api
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Calendar__TimeZone: ${Calendar__TimeZone:-UTC}
      HISTORICAL_INTEREST_WEEKS: ${HISTORICAL_INTEREST_WEEKS:-4}
      HISTORICAL_INTEREST_ENABLED: ${HISTORICAL_INTEREST_ENABLED:-true}
      COOKED_COOLDOWN_WEEKS: ${COOKED_COOLDOWN_WEEKS:-4}
      DREAMING_ROTATION_ENABLED: ${DREAMING_ROTATION_ENABLED:-true}

      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:-postgres://recipe_app:secure_dev_password@postgres:5432/recipe_app_db}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      WFS_TELEMETRY_ENABLED: ${WFS_TELEMETRY_ENABLED:-false}
      SENTRAME_OTLP_BASE: ${SENTRAME_OTLP_BASE:-}
      SENTRAME_SERVER_TOKEN: ${SENTRAME_SERVER_TOKEN:-}
      WFS_VERSION: ${WFS_VERSION:-}
      ASPNETCORE_URLS: http://+:9001
      CORS__ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://pwa.wfs.localhost,http://localhost:3000}
      DATA_ROOT: /data
      DREAMING_CRON_UTC: "${DREAMING_CRON_UTC:-0 3 * * *}"
      ELEVATED_ACTIONS_PIN: ${ELEVATED_ACTIONS_PIN:-}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-gemini-embedding-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID}
      GEMINI_ENDPOINT: ${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}
      IMPORT_TARGET_LANGUAGE: ${IMPORT_TARGET_LANGUAGE:-NONE}
      HEARTH_SECRET: ${HEARTH_SECRET}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESTORE_CRON_UTC: "${DEMO_RESTORE_CRON_UTC:-0 3 * * *}"

    depends_on:
      postgres:
        condition: service_healthy
        required: true
      migration:
        condition: service_completed_successfully
        required: true

    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wfs-proxy"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_NAME:-pwa.wfs.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=9001"
      # Dedicated SSE router with unbuffered headers
      - "traefik.http.routers.api-stream.rule=Host(`${DOMAIN_NAME:-pwa.wfs.localhost}`) && Path(`/api/stream`)"
      - "traefik.http.routers.api-stream.entrypoints=web"
      - "traefik.http.routers.api-stream.middlewares=sse-headers@file"
      - "traefik.http.routers.api-stream.priority=100"
 

  # ──────────────────────────────────────────────────────────────────────────
  # Next.js 15 PWA
  # ──────────────────────────────────────────────────────────────────────────
  pwa:
    container_name: whats-for-supper-pwa
    build:
      context: ../../pwa
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    environment:


      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:9001}
      DEMO_MODE: ${DEMO_MODE:-false}
      HEARTH_SECRET: ${HEARTH_SECRET}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      WFS_VERSION: ${WFS_VERSION:-}
      WFS_TELEMETRY_ENABLED: ${WFS_TELEMETRY_ENABLED:-false}
      SENTRAME_OTLP_BASE: ${SENTRAME_OTLP_BASE:-}
      SENTRAME_BROWSER_TOKEN: ${SENTRAME_BROWSER_TOKEN:-}
      SENTRAME_SERVER_TOKEN: ${SENTRAME_SERVER_TOKEN:-}
    depends_on:
      - api
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wfs-proxy"
      - "traefik.http.routers.pwa.rule=Host(`${DOMAIN_NAME:-pwa.wfs.localhost}`)"
      - "traefik.http.routers.pwa.entrypoints=web"
      - "traefik.http.services.pwa.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  proxy:
    name: wfs-proxy
  internal:
    name: wfs-internal

volumes:
